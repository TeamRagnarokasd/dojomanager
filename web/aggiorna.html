<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aggiornamento in corso…</title>
  <style>
    :root {
      color-scheme: dark;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000000;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding: 24px;
      box-sizing: border-box;
      text-align: center;
    }
    main {
      max-width: 420px;
    }
    h1 {
      font-size: 1.4rem;
      margin-bottom: 12px;
    }
    p {
      font-size: 1rem;
      line-height: 1.5;
      color: #d0d0d0;
    }
    .spinner {
      margin: 24px auto;
      width: 36px;
      height: 36px;
      border: 4px solid rgba(255, 255, 255, 0.2);
      border-top-color: #ff0000;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .fallback {
      display: inline-block;
      margin-top: 28px;
      color: #999999;
      font-size: 0.85rem;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <main>
    <h1>Aggiornamento in corso…</h1>
    <p>Sto aggiornando l'app, un attimo</p>
    <div class="spinner"></div>
    <a id="fallback-link" class="fallback" href="https://teamragnarokasd.github.io/dojomanager/">Tocca qui se non parte</a>
  </main>
  <script>
    (function () {
      var targetUrl = 'https://teamragnarokasd.github.io/dojomanager/?v=' + Date.now();

      var fallbackLink = document.getElementById('fallback-link');
      if (fallbackLink) {
        fallbackLink.href = targetUrl;
      }

      var redirected = false;
      function redirectNow() {
        if (redirected) return;
        redirected = true;
        try {
          location.replace(targetUrl);
        } catch (e) {}
      }

      var unregisterDone = new Promise(function (resolve) {
        try {
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function (registrations) {
              return Promise.all(registrations.map(function (registration) {
                return registration.unregister().catch(function () {});
              }));
            }).then(resolve).catch(resolve);
          } else {
            resolve();
          }
        } catch (e) {
          resolve();
        }
      });

      var cachesCleared = new Promise(function (resolve) {
        try {
          if (window.caches && caches.keys) {
            caches.keys().then(function (names) {
              return Promise.all(names.map(function (name) {
                return caches.delete(name).catch(function () {});
              }));
            }).then(resolve).catch(resolve);
          } else {
            resolve();
          }
        } catch (e) {
          resolve();
        }
      });

      // Redirect only once both cleanups have finished, but never wait more
      // than 4 seconds for them — a stuck service worker or cache API must
      // not strand the user on this page.
      Promise.all([unregisterDone, cachesCleared]).then(redirectNow).catch(redirectNow);
      setTimeout(redirectNow, 4000);
    })();
  </script>
</body>
</html>
