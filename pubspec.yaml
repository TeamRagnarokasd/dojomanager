name: dojomanager
description: A new Flutter project.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:       # CRITICAL: Required for every Flutter project - DO NOT REMOVE
    sdk: flutter # CRITICAL: Required for every Flutter project - DO NOT REMOVE
  flutter_localizations:  # CRITICAL: Required for Flutter localization - DO NOT REMOVE
    sdk: flutter           # CRITICAL: Required for Flutter localization - DO NOT REMOVE
  
  # CRITICAL: Core UI and responsive design - DO NOT REMOVE OR MODIFY
  sizer: ^3.1.3               # Required for responsive design system
  flutter_svg: ^2.0.9        # Required for SVG icon support
  google_fonts: ^6.2.1       # Required for typography (replaces local fonts)
  shared_preferences: ^2.5.3 # Required for local data storage and storing reminder system data and biometric settings persistence
  
  # Feature dependencies - safe to modify
  dio: ^5.9.0
  fluttertoast: ^8.2.12
  fl_chart: ^0.71.0
  path_provider: ^2.1.5       # Required for file system access and document storage
  camera: ^0.10.5+9
  image_picker: ^1.2.0        # Required for image selection and camera functionality
  permission_handler: ^12.0.1
  file_picker: ^8.1.7
  url_launcher: ^6.3.1        # Required for opening medical certificate URLs in external applications
  supabase_flutter: ^2.10.3   # Required for complete Supabase integration
  crypto: ^3.0.6
  flutter_local_notifications: ^19.4.1  # Required for push notifications and communication alerts
  pdf: ^3.10.4                # Required for PDF document creation with the beautiful receipt layout
  share_plus: ^11.1.0
  printing: ^5.11.0           # Required for displaying and saving PDF files on mobile devices

  web: any
  table_calendar: ^3.1.3      # Required for advanced calendar functionality and date selection
  image_cropper: ^9.1.0
  flutter_slidable: ^4.0.1
  cron: ^0.6.2
  universal_html: ^2.2.4
  cached_network_image: any
  local_auth: ^2.1.8
  uuid: ^4.5.2
  image: ^4.0.17              # Required for advanced image compression and resizing to ensure profile photos stay under 1MB

  intl: ^0.20.2               # Required for date formatting and internationalization
  easy_localization: ^3.0.8

dev_dependencies:
  flutter_test:    # CRITICAL: Required for Flutter project testing - DO NOT REMOVE
    sdk: flutter   # CRITICAL: Required for Flutter project testing - DO NOT REMOVE
  flutter_lints: ^5.0.0 # CRITICAL: Required for code quality - DO NOT REMOVE
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/images/Screenshot_20250824_003459_Instagram-1785710319937.jpg"
  min_sdk_android: 21
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/images/Screenshot_20250824_003459_Instagram-1785710319937.jpg"
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/images/Screenshot_20250824_003459_Instagram-1785710319937.jpg"
    background_color: "#000000"
    theme_color: "#000000"

flutter:
  uses-material-design: true # CRITICAL: Required for Material icon font - DO NOT REMOVE
  assets:
    - assets/
    - assets/images/
    - assets/images/4405-1756506471662.png
    - assets/translations/
  # CRITICAL ASSET MANAGEMENT RULES:
  # - DO NOT ADD NEW ASSET DIRECTORIES (assets/svg/, assets/icons/, etc.)
  # - ONLY USE EXISTING AND ITEMS AVAILABLE IN THE DIRECTORIES LISTED ABOVE (assets/, assets/images/)
  
  # CRITICAL FONTS RULE: 
  # - THIS PROJECT USES GOOGLE FONTS INSTEAD OF LOCAL FONTS
  # - DO NOT ADD ANY LOCAL FONTS SECTION OR FONT FILES
